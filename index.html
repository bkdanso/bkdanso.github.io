<style>
  :root{
    --bg:#f6f1e9; --ink:#2b2420; --muted:#6f6359; --card:#fffdf9;
    --line:#e3d8c8; --accent:#9a4a26; --accent-2:#3f5d55;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1715; --ink:#f1e9df; --muted:#b3a597; --card:#25201d; --line:#3a322c; --accent:#e08a5c; --accent-2:#8fb8aa; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Inter,system-ui,sans-serif; color:var(--ink); background:var(--bg);
    min-height:100vh; display:flex; justify-content:center; padding:56px 20px 40px;
    background-image:
      repeating-linear-gradient(176deg, transparent 0 46px, color-mix(in srgb, var(--line) 55%, transparent) 46px 47px);
  }
  main{width:100%; max-width:520px}
  header{text-align:center; margin-bottom:32px}
  .avatar{
    width:132px;height:132px;border-radius:50%;border:4px solid var(--card);margin:0 auto 18px;
    display:grid;place-items:center;font-family:Fraunces,serif;font-size:34px;font-weight:650;
    color:#fff; background:linear-gradient(145deg,var(--accent),#5b2c17 70%);
    box-shadow:0 6px 20px rgba(0,0,0,.18); overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-family:Fraunces,serif;font-weight:650;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
  .role{margin-top:8px;color:var(--muted);font-size:.98rem}
  .fields{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .fields span{
    font-size:.8rem;font-weight:500;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--accent-2)
  }
  nav{display:flex;flex-direction:column;gap:12px}
  a.link{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.link:hover,a.link:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.08);outline:none}
  .icon{
    flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)
  }
  .icon svg{width:22px;height:22px}
  .text{flex:1;min-width:0}
  .text strong{display:block;font-weight:600;font-size:1rem}
  .text small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
  .arrow{color:var(--muted);font-size:1.1rem}
  #preprints{margin-top:34px}
  #preprints h2{font-family:Fraunces,serif;font-weight:500;font-size:1.15rem;margin:0 0 12px 4px;color:var(--muted)}
  .plist{display:flex;flex-direction:column;gap:10px}
  a.link.small{padding:11px 16px}
  a.link.small .icon{width:34px;height:34px;background:color-mix(in srgb,var(--accent-2) 14%,transparent);color:var(--accent-2)}
  a.link.small .icon svg{width:18px;height:18px}
  a.link.small strong{font-size:.93rem;font-weight:500;line-height:1.35}
  footer{text-align:center;margin-top:36px;color:var(--muted);font-size:.8rem}
</style>
